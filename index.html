    <script id="stlite-files" type="application/json">{"svr_roughness/__init__.py": "\"\"\"Surface roughness analysis for scanner point clouds.\"\"\"\n\nfrom ._display_grid import svr_map\nfrom ._version import version as __version__\nfrom .analyze import (\n    analyze_file,\n    analyze_ply,\n    analyze_points,\n    compute_roughness,\n    compute_roughness_from_ply,\n)\nfrom .config import RoughnessConfig\nfrom .io import load_ascii_ply, load_delimited, load_obj, load_pcd, load_ply, load_points, load_stl_vertices\nfrom .result import PlaneFit, RoughnessGrid, RoughnessResult, format_report\n\n__all__ = [\n    \"PlaneFit\",\n    \"RoughnessConfig\",\n    \"RoughnessGrid\",\n    \"RoughnessResult\",\n    \"__version__\",\n    \"analyze_file\",\n    \"analyze_ply\",\n    \"analyze_points\",\n    \"compute_roughness\",\n    \"compute_roughness_from_ply\",\n    \"format_report\",\n    \"load_ascii_ply\",\n    \"load_delimited\",\n    \"load_obj\",\n    \"load_pcd\",\n    \"load_ply\",\n    \"load_points\",\n    \"load_stl_vertices\",\n    \"svr_map\",\n]\n", "svr_roughness/__main__.py": "from __future__ import annotations\n\nimport argparse\nimport sys\nfrom pathlib import Path\n\nfrom .analyze import analyze_file\nfrom .config import RoughnessConfig\nfrom .result import format_report\n\n\ndef main() -> None:\n    if hasattr(sys.stdout, \"reconfigure\"):\n        try:\n            sys.stdout.reconfigure(encoding=\"utf-8\")\n        except Exception:\n            pass\n\n    parser = argparse.ArgumentParser(description=\"Calculate surface roughness from a point-cloud file.\")\n    parser.add_argument(\"input\", type=Path, help=\"Input PLY, PCD, STL, OBJ, CSV, XYZ, TXT, TSV, NPY, or NPZ file\")\n    parser.add_argument(\"--grid-mm\", type=float, default=0.20, help=\"Grid pitch / downsample in mm (default: 0.20)\")\n    parser.add_argument(\"--short-cutoff-mm\", type=float, default=1.0, help=\"Short cutoff lambda_s in mm (default: 1.0)\")\n    parser.add_argument(\"--long-cutoff-mm\", type=float, default=25.0, help=\"Long cutoff lambda_c in mm (default: 25.0)\")\n    parser.add_argument(\n        \"--gaussian-mesh\", action=\"store_true\", default=True, help=\"Enforce ISO 16610-61 Gaussian filtration\"\n    )\n    parser.add_argument(\"--metrics-out\", type=Path)\n    parser.add_argument(\"--grid-out\", type=Path)\n    args = parser.parse_args()\n\n    result = analyze_file(\n        args.input,\n        RoughnessConfig(\n            grid_mm=args.grid_mm,\n            short_cutoff_mm=args.short_cutoff_mm,\n            long_cutoff_mm=args.long_cutoff_mm,\n            gaussian_mesh=args.gaussian_mesh,\n        ),\n    )\n    print(format_report(result))\n    if args.metrics_out:\n        result.save_metrics_json(args.metrics_out)\n    if args.grid_out:\n        result.save_grid_npz(args.grid_out)\n\n\nif __name__ == \"__main__\":\n    main()\n\n", "svr_roughness/_display_grid.py": "from __future__ import annotations\n\nimport numpy as np\nimport numpy.typing as npt\n\nfrom .config import RoughnessConfig\nfrom .result import BoolArray, FloatArray, PlaneFit\n\n\ndef fit_plane_basis(points: npt.ArrayLike) -> PlaneFit:\n    \"\"\"Fit a plane to the point cloud and return a local coordinate system.\n\n    The X-axis is the projection of global X onto the fitted plane, preserving\n    the original scan orientation rather than rotating to PCA axes.\n    \"\"\"\n    points_array = np.asarray(points, dtype=np.float64)\n    centroid = points_array.mean(axis=0)\n    centered = points_array - centroid\n    # Fast 3x3 covariance eigen-decomposition (O(N) single pass vs O(N*3^2) full SVD)\n    cov = (centered.T @ centered) / max(len(points_array) - 1, 1)\n    _, eigvecs = np.linalg.eigh(cov)\n    normal = eigvecs[:, 0]\n    if normal[2] \u003c 0:\n        normal = -normal\n    normal /= np.linalg.norm(normal)\n\n    # Project global X-axis onto the fitted plane to keep the original scan orientation\n    # instead of rotating based on point distribution variance (PCA).\n    global_x = np.array([1.0, 0.0, 0.0])\n    x_axis = global_x - normal * np.dot(global_x, normal)\n    x_axis_norm = np.linalg.norm(x_axis)\n\n    if x_axis_norm \u003c 1e-6:\n        global_y = np.array([0.0, 1.0, 0.0])\n        x_axis = global_y - normal * np.dot(global_y, normal)\n        x_axis /= np.linalg.norm(x_axis)\n    else:\n        x_axis /= x_axis_norm\n\n    y_axis = np.cross(normal, x_axis)\n    y_axis /= np.linalg.norm(y_axis)\n    coords = np.column_stack((centered @ x_axis, centered @ y_axis, centered @ normal))\n    return PlaneFit(centroid=centroid, normal=normal, x_axis=x_axis, y_axis=y_axis, coords=coords)\n\n\ndef crop_points(coords: FloatArray, config: RoughnessConfig) -> tuple[FloatArray, BoolArray]:\n    \"\"\"Crop points by percentile and/or range filters.\"\"\"\n    mask = np.ones(len(coords), dtype=bool)\n    if config.percentile_crop > 0:\n        p = config.percentile_crop\n        xlo, xhi = np.percentile(coords[:, 0], [p, 100 - p])\n        ylo, yhi = np.percentile(coords[:, 1], [p, 100 - p])\n        mask &= (coords[:, 0] >= xlo) & (coords[:, 0] \u003c= xhi)\n        mask &= (coords[:, 1] >= ylo) & (coords[:, 1] \u003c= yhi)\n    if config.x_range:\n        mask &= (coords[:, 0] >= config.x_range[0]) & (coords[:, 0] \u003c= config.x_range[1])\n    if config.y_range:\n        mask &= (coords[:, 1] >= config.y_range[0]) & (coords[:, 1] \u003c= config.y_range[1])\n    if config.z_range:\n        mask &= (coords[:, 2] >= config.z_range[0]) & (coords[:, 2] \u003c= config.z_range[1])\n    return coords[mask], mask\n\n\ndef svr_map(\n    grid_filtered: FloatArray,\n    valid_mask: BoolArray,\n    grid_mm: float,\n    svr_points: int = 20,\n    svr_span_mm: float = 0.5,\n) -> FloatArray:\n    \"\"\"Compute local Svr variogram map (in \u00b5m) for 2D heatmap rendering.\"\"\"\n    rows, cols = grid_filtered.shape\n    output = np.full((rows, cols), np.nan, dtype=np.float64)\n    if not np.any(valid_mask) or grid_mm \u003c= 0 or svr_span_mm \u003c= 0:\n        return output\n\n    max_dist_mm = svr_points * svr_span_mm\n    radius_cells = int(np.ceil(max_dist_mm / grid_mm))\n\n    y_indices, x_indices = np.where(valid_mask)\n    for r, c in zip(y_indices, x_indices):\n        r_min = max(0, r - radius_cells)\n        r_max = min(rows, r + radius_cells + 1)\n        c_min = max(0, c - radius_cells)\n        c_max = min(cols, c + radius_cells + 1)\n\n        sub_grid = grid_filtered[r_min:r_max, c_min:c_max]\n        sub_valid = valid_mask[r_min:r_max, c_min:c_max]\n\n        center_val = grid_filtered[r, c]\n        sub_y, sub_x = np.ogrid[r_min - r : r_max - r, c_min - c : c_max - c]\n        dists_mm = np.sqrt(sub_y**2 + sub_x**2) * grid_mm\n\n        mask = sub_valid & (dists_mm > 0) & (dists_mm \u003c= max_dist_mm)\n        if not np.any(mask):\n            continue\n\n        diffs_um = (center_val - sub_grid[mask]) * 1000.0\n        output[r, c] = float(np.sqrt(np.mean(diffs_um**2)))\n\n    return output\n", "svr_roughness/_version.py": "# file generated by vcs-versioning\n# don't change, don't track in version control\nfrom __future__ import annotations\n\n__all__ = [\n    \"__version__\",\n    \"__version_tuple__\",\n    \"version\",\n    \"version_tuple\",\n    \"__commit_id__\",\n    \"commit_id\",\n]\n\nversion: str\n__version__: str\n__version_tuple__: tuple[int | str, ...]\nversion_tuple: tuple[int | str, ...]\ncommit_id: str | None\n__commit_id__: str | None\n\n__version__ = version = '0.5.94.dev0+g922a7bc81.d20260908'\n__version_tuple__ = version_tuple = (0, 5, 94, 'dev0', 'g922a7bc81.d20260908')\n\n__commit_id__ = commit_id = 'g922a7bc81'\n", "svr_roughness/algorithm.py": "\"\"\"Pure-Python ASTM WK92969 Gaussian areal roughness numerical core.\n\nReplaces the legacy C++ DLL with a fully vectorized NumPy/SciPy engine.\nImplements the exact 5-stage pipeline from SurfInspect:\n1. Centering & unit adjustment\n2. Voxel grid downsampling (fast 1D key-based grouping)\n3. PCA best-fit plane alignment (matching PCL PCA convention)\n4. 2.5D elevation grid rasterization with boundary cropping & hole filling\n5. Dual-pass ISO 16610-61 Gaussian filtration (alpha=0.4697)\n6. 2D FFT autocorrelation variogram (Sa, Sq, Svr) and local Svr dispersion map\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom typing import NamedTuple\n\nimport numpy as np\nfrom scipy import ndimage, signal\n\n\nclass PurePythonResult(NamedTuple):\n    sa_um: float\n    sq_um: float\n    svr_um: float\n    processed_points: int\n    variogram_bins_um: np.ndarray\n    variogram_counts: np.ndarray\n    surface_distances_mm: np.ndarray\n    grid_width: int\n    grid_height: int\n    grid_origin_mm: np.ndarray\n    grid_z_mm: np.ndarray\n    grid_svr_um: np.ndarray\n\n\ndef voxel_downsample(points_m: np.ndarray, voxel_size_m: float) -> np.ndarray:\n    \"\"\"Downsample point cloud using 3D voxel grid centroids (matching pcl::VoxelGrid).\n\n    Uses fast 1D key-based grouping for O(N) performance on large point clouds.\n    \"\"\"\n    if len(points_m) == 0:\n        return points_m\n\n    min_pt = points_m.min(axis=0)\n    coords = np.floor((points_m - min_pt) / voxel_size_m).astype(np.int64)\n    max_c = coords.max(axis=0) + 1\n\n    stride_y = max_c[2]\n    stride_x = max_c[1] * stride_y\n    key = coords[:, 0] * stride_x + coords[:, 1] * stride_y + coords[:, 2]\n\n    _, inverse = np.unique(key, return_inverse=True)\n    counts = np.bincount(inverse)\n\n    downsampled = np.column_stack([\n        np.bincount(inverse, weights=points_m[:, dim]) / counts\n        for dim in range(3)\n    ])\n    return downsampled\n\n\ndef pca_align_plane(points_m: np.ndarray) -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n    \"\"\"Align point cloud surface normal to +Z axis using PCA eigendecomposition (matching PCL PCA).\"\"\"\n    centroid = points_m.mean(axis=0)\n    centered = points_m - centroid\n    cov = (centered.T @ centered) / max(len(points_m), 1)\n\n    eigenvalues, eigenvectors = np.linalg.eigh(cov)\n    # Sort descending: column 0 is max variance (X), 1 is mid (Y), 2 is normal (Z)\n    order = np.argsort(eigenvalues)[::-1]\n    eig_vecs = eigenvectors[:, order]\n\n    # Ensure right-handed coordinate system\n    if np.linalg.det(eig_vecs) \u003c 0:\n        eig_vecs[:, 2] = -eig_vecs[:, 2]\n\n    # Rotate points into plane coordinates (col 0 -> X, col 1 -> Y, col 2 -> Z)\n    rotated = centered @ eig_vecs\n\n    # Zero-center Z\n    z_mean = rotated[:, 2].mean()\n    rotated[:, 2] -= z_mean\n\n    return rotated, centroid, eig_vecs\n\n\ndef _crop_grid_boundaries(valid_mask: np.ndarray) -> tuple[int, int, int, int]:\n    \"\"\"Shave invalid boundary borders matching cropPointCloud in cloud_viewer.cpp.\n\n    Returns (y_begin, y_end, x_begin, x_end).\n    \"\"\"\n    missing_xy = (~valid_mask).T\n    dim_x, dim_y = missing_xy.shape\n\n    missing_data = np.zeros((dim_x, dim_y), dtype=np.uint8)\n    missing_data[missing_xy] = 1\n\n    seen = np.zeros((dim_x, dim_y), dtype=bool)\n    dr = [0, 1, 0, -1]\n    dc = [1, 0, -1, 0]\n    r, c, di = 0, 0, 0\n    order: list[tuple[int, int]] = []\n\n    for _ in range(dim_x * dim_y):\n        order.append((r, c))\n        seen[r, c] = True\n        cr = r + dr[di]\n        cc = c + dc[di]\n        if 0 \u003c= cr \u003c dim_x and 0 \u003c= cc \u003c dim_y and not seen[cr, cc]:\n            r, c = cr, cc\n        else:\n            di = (di + 1) % 4\n            r += dr[di]\n            c += dc[di]\n\n    for r, c in order:\n        if missing_data[r, c] == 1:\n            if r == 0 or r == dim_x - 1 or c == 0 or c == dim_y - 1:\n                missing_data[r, c] = 2\n            elif (\n                (r > 0 and missing_data[r - 1, c] == 2)\n                or (r \u003c dim_x - 1 and missing_data[r + 1, c] == 2)\n                or (c > 0 and missing_data[r, c - 1] == 2)\n                or (c \u003c dim_y - 1 and missing_data[r, c + 1] == 2)\n            ):\n                missing_data[r, c] = 2\n\n    x_begin, x_end = 0, dim_x\n    y_begin, y_end = 0, dim_y\n    changed = True\n    while changed:\n        changed = False\n        for x in range(x_begin, x_end):\n            if missing_data[x, y_begin] == 2:\n                y_begin += 1\n                changed = True\n                break\n        for y in range(y_begin, y_end):\n            if missing_data[x_end - 1, y] == 2:\n                x_end -= 1\n                changed = True\n                break\n        for x in range(x_begin, x_end):\n            if missing_data[x, y_end - 1] == 2:\n                y_end -= 1\n                changed = True\n                break\n        for y in range(y_begin, y_end):\n            if missing_data[x_begin, y] == 2:\n                x_begin += 1\n                changed = True\n                break\n\n    return y_begin, y_end, x_begin, x_end\n\n\ndef rasterize_elevation_grid(\n    rotated_pts_m: np.ndarray,\n    pitch_m: float,\n) -> tuple[np.ndarray, np.ndarray, float, float]:\n    \"\"\"Rasterize 3D points onto regular 2D elevation grid using bilinear scatter interpolation.\n\n    Matches createDenseGridPointCloud and cropPointCloud in cloud_viewer.cpp.\n    \"\"\"\n    min_x, min_y = float(rotated_pts_m[:, 0].min()), float(rotated_pts_m[:, 1].min())\n    max_x, max_y = float(rotated_pts_m[:, 0].max()), float(rotated_pts_m[:, 1].max())\n\n    steps_x = int(math.ceil((max_x - min_x) / pitch_m)) + 1\n    steps_y = int(math.ceil((max_y - min_y) / pitch_m)) + 1\n\n    inv_pitch = 1.0 / pitch_m\n    ux = (rotated_pts_m[:, 0] - min_x) * inv_pitch\n    uy = (rotated_pts_m[:, 1] - min_y) * inv_pitch\n\n    ix0 = np.clip(np.floor(ux).astype(np.int32), 0, steps_x - 2)\n    iy0 = np.clip(np.floor(uy).astype(np.int32), 0, steps_y - 2)\n    fx = np.clip(ux - ix0, 0.0, 1.0)\n    fy = np.clip(uy - iy0, 0.0, 1.0)\n\n    w00 = (1.0 - fx) * (1.0 - fy)\n    w10 = fx * (1.0 - fy)\n    w01 = (1.0 - fx) * fy\n    w11 = fx * fy\n\n    grid_sum_zw = np.z .float64))\n\n\ndef _ply_numpy_dtype(type_name: str) -> str:\n    dtype = {\n        \"char\": \"\u003ci1\",\n        \"int8\": \"\u003ci1\",\n        \"uchar\": \"\u003cu1\",\n        \"uint8\": \"\u003cu1\",\n        \"short\": \"\u003ci2\",\n        \"int16\": \"\u003ci2\",\n        \"ushort\": \"\u003cu2\",\n        \"uint16\": \"\u003cu2\",\n        \"int\": \"\u003ci4\",\n        \"int32\": \"\u003ci4\",\n        \"uint\": \"\u003cu4\",\n        \"uint32\": \"\u003cu4\",\n        \"float\": \"\u003cf4\",\n        \"double\": \"\u003cf8\",\n    }.get(type_name)\n    if dtype is None:\n        raise ValueError(f\"Unsupported PLY property type: {type_name}\")\n    return dtype\n\n\ndef load_pcd(path: str | Path) -> FloatArray:\n    with Path(path).open(\"rb\") as handle:\n        header, data_start = _read_pcd_header(handle)\n        fields = header[\"FIELDS\"].split()\n        points_count = int(header[\"POINTS\"])\n        data_mode = header.get(\"DATA\", \"\").lower()\n\n        handle.seek(data_start)\n        if data_mode == \"ascii\":\n            points = _read_ascii_pcd(handle, fields, points_count)\n        elif data_mode == \"binary\":\n            points = _read_binary_pcd(handle, header, fields, points_count)\n        else:\n            raise ValueError(f\"Unsupported PCD DATA mode: {header.get('DATA')}\")\n    return _clean_loaded_points(points)\n\n\ndef load_stl_vertices(path: str | Path) -> FloatArray:\n    raw = Path(path).read_bytes()\n    if _looks_like_binary_stl(raw):\n        vertices = _read_binary_stl_vertices(raw)\n    else:\n        vertices = _read_ascii_stl_vertices(raw.decode(\"utf-8\", errors=\"ignore\"))\n    return _clean_loaded_points(np.unique(np.round(vertices, decimals=9), axis=0))\n\n\ndef _read_pcd_header(handle: BinaryIO) -> tuple[dict[str, str], int]:\n    header: dict[str, str] = {}\n    while True:\n        line = handle.readline()\n        if not line:\n            raise ValueError(\"PCD header ended before DATA\")\n ", "svr_roughness/result.py": "from __future__ import annotations\n\nimport json\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nimport numpy as np\nimport numpy.typing as npt\n\nfrom .config import RoughnessConfig\n\nFloatArray = npt.NDArray[np.float64]\nBoolArray = npt.NDArray[np.bool_]\nIntArray = npt.NDArray[np.int64]\n\n\n@dataclass(frozen=True)\nclass PlaneFit:\n    centroid: FloatArray\n    normal: FloatArray\n    x_axis: FloatArray\n    y_axis: FloatArray\n    coords: FloatArray\n\n\n@dataclass(frozen=True)\nclass RoughnessGrid:\n    raw: FloatArray\n    filled: FloatArray\n    filtered: FloatArray\n    valid_raw: BoolArray\n    valid_filled: BoolArray\n    origin: FloatArray\n    svr_map: FloatArray | None = None\n\n\n@dataclass(frozen=True)\nclass RoughnessResult:\n    sa_um: float\n    sq_um: float\n    svr_um: float\n    points: int\n    cropped_points: int\n    plane: PlaneFit\n    raw_residual_std_mm: float\n    raw_residual_p05_mm: float\n    raw_residual_p95_mm: float\n    grid: RoughnessGrid\n    surface_distances_mm: FloatArray\n    variogram_bins_um: FloatArray\n    variogram_counts: IntArray\n    config: RoughnessConfig\n\n    @property\n    def svr_mm(self) -> float:\n        \"\"\"S_VR in millimeters, as defined by ASTM WK92969 \u00a73.1.3.\"\"\"\n        return self.svr_um / 1000.0\n\n    @property\n    def svr_in(self) -> float:\n        \"\"\"S_VR in inches (1 mm = 0.0393701 in).\"\"\"\n        return self.svr_mm / 25.4\n\n    @property\n    def patch_width_mm(self) -> float:\n        \"\"\"Width of the surface patch along the fitted plane X-axis in mm.\"\"\"\n        return float(self.plane.coords[:, 0].max() - self.plane.coords[:, 0].min())\n\n    @property\n    def patch_height_mm(self) -> float:\n        \"\"\"Height of the surface patch along the fitted plane Y-axis in mm.\"\"\"\n        return float(self.plane.coords[:, 1].max() - self.plane.coords[:, 1].min())\n\n    @property\n    def patch_area_mm2(self) -> float:\n        \"\"\"Estimated surface area of the patch in mm\u00b2.\"\"\"\n        return self.patch_width_mm * self.patch_height_mm\n\n    @property\n    def point_density_pts_mm2(self) -> float:\n        \"\"\"Average point density of the raw cloud in points per mm\u00b2.\"\"\"\n        area = self.patch_area_mm2\n        return (self.points / area) if area > 0 else 0.0\n\n    @property\n    def average_point_spacing_mm(self) -> float:\n        \"\"\"Estimated average point spacing in mm.\"\"\"\n        density = self.point_density_pts_mm2\n        return float(1.0 / np.sqrt(density)) if density > 0 else 0.0\n\n    def comparator_equivalents(self) -> dict[str, str]:\n        \"\"\"Convert S_VR to approximate equivalent comparator visual grades per Appendices X1-X3.\n\n        ASTM WK92969 references:\n          - Appendix X1: GAR C-9 Cast Microfinish Comparator\n          - Appendix X2: SCRATA Standard (ASTM A802)\n          - Appendix X3: ACI Surface Indicator Scale\n        \"\"\"\n        svr = self.svr_mm\n\n        # SCRATA Comparator (A802) - Appendix X2\n        # A1: 0.0264 mm, A2: 0.0448 mm, A3: 0.0630 mm, A4: 0.1315 mm\n        if svr \u003c 0.0214:\n            scrata = \"\u003c A1 (Finer than 0.026 mm)\"\n        elif svr \u003c= 0.0356:\n            scrata = \"A1 (Nominal ~0.026 mm)\"\n        elif svr \u003c= 0.0539:\n            scrata = \"A2 (Nominal ~0.045 mm)\"\n        elif svr \u003c= 0.0973:\n            scrata = \"A3 (Nominal ~0.063 mm)\"\n        elif svr \u003c= 0.1500:\n            scrata = \"A4 (Nominal ~0.132 mm)\"\n        else:\n            scrata = \"> A4 (Rougher than 0.132 mm)\"\n\n        # GAR C-9 Comparator - Appendix X1\n        # 200: 0.0092, 300: 0.0163, 420: 0.0187, 560: 0.0274, 720: 0.0585, 900: 0.0711 mm\n        if svr \u003c 0.0089:\n            gar = \"\u003c C-9 200\"\n        elif svr \u003c= 0.0128:\n            gar = \"C-9 200 (Nominal ~0.009 mm)\"\n        elif svr \u003c= 0.0175:\n            gar = \"C-9 300 (Nominal ~0. loat(self.config.mesh_smoothing_mm),\n            \"max_svr_points\": int(self.config.max_svr_points),\n        }\n\n    def save_metrics_json(self, path: str | Path) -> None:\n        save_metrics_json(self, path)\n\n    def save_grid_npz(self, path: str | Path) -> None:\n        save_grid_npz(self, path)\n\n\ndef save_grid_npz(result: RoughnessResult, path: str | Path) -> None:\n    Path(path).parent.mkdir(parents=True, exist_ok=True)\n    np.savez(\n        Path(path),\n        grid_raw=result.grid.raw,\n        grid_filled=result.grid.filled,\n        grid_filtered=result.grid.filtered,\n        valid_raw=result.grid.valid_raw,\n        valid_filled=result.grid.valid_filled,\n        grid_origin=result.grid.origin,\n        plane_centroid=result.plane.centroid,\n        plane_normal=result.plane.normal,\n        plane_x_axis=result.plane.x_axis,\n        plane_y_axis=result.plane.y_axis,\n    )\n\n\ndef save_metrics_json(result: RoughnessResult, path: str | Path) -> None:\n    metrics_path = Path(path)\n    metrics_path.parent.mkdir(parents=True, exist_ok=True)\n    metrics_path.write_text(json.dumps(result.metrics_dict(), indent=2) + \"\\n\")\n\n\ndef format_report(result: RoughnessResult, target_svr_mm: float | None = None) -> str:\n    \"\"\"Format a human-readable report per ASTM WK92969 \u00a710.\n\n    \u00a710.1 required fields:\n      - 10.1.1  Test result (S_VR)\n      - 10.1.2  Evaluation length\n      - 10.1.3  Distance bucket size\n      - 10.1.4  Cutoff wavelengths\n      - 10.1.5  Pre-processing parameters\n    \"\"\"\n    eval_length_mm = result.config.svr_points * result.config.svr_span_mm\n    patch_w = result.patch_width_mm\n    patch_h = result.patch_height_mm\n    density = result.point_density_pts_mm2\n    spacing = result.average_point_spacing_mm\n\n    # ASTM WK92969 \u00a73.1.5 recommendation: 50x50 mm or larger\n    patch_valid = patch_w >= 50.0 and patch_h >= 50.0\n    # ASTM WK92969 \u00a78.2 requirement: Point density of 0.2 mm or better required\n    density_valid = spacing \u003c= 0.20\n\n    lines = [\n        \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\",\n        \"  ASTM WK92969 Surface Variogram Roughness (S_VR) Report\",\n        \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\",\n        \"\",\n        \"\u00a710.1.1  Test Result\",\n        f\"  S_VR = {result.svr_mm:.4f} mm  ({result.svr_um:.3f} \u00b5m / {result.svr_in:.5f} in)\",\n        f\"  Sa   = {result.sa_um:.3f} \u00b5m\",\n        f\"  Sq   = {result.sq_um:.3f} \u00b5m\",\n    ]\n\n    if target_svr_mm is not None and target_svr_mm > 0:\n        passed = result.svr_mm \u003c= target_svr_mm\n        status_str = \"PASS (Within specification)\" if passed else \"FAIL (Exceeds specification)\"\n        lines.extend(\n            [\n                f\"  Purchaser Spec Target: \u003c= {target_svr_mm:.4f} mm\",\n                f\"  Status (\u00a75.3):        {status_str}\",\n            ]\n        )\n\n    lines.extend(\n        [\n            \"\",\n            \"\u00a710.1.2  Evaluation Length\",\n            f\"  {eval_length_mm:.1f} mm  ({result.config.svr_points} bins \u00d7 {result.config.svr_span_mm} mm)\",\n            \"\",\n            \"\u00a710.1.3  Distance Bucket Size\",\n            f\"  {result.config.svr_span_mm} mm\",\n            \"\",\n            \"\u00a710.1.4  Cutoff Wavelengths\",\n            f\"  Short (\u03bbs): {result.config.short_cutoff_mm:g} mm\",\n            f\"  Long  (\u03bbc): {result.config.long_cutoff_mm:g} mm\",\n            \"\",\n            \"\u00a710.1.5  Pre-processing Parameters\",\n            f\"  Downsampling:   {result.config.grid_mm} mm\",\n            f\"  Outlier filter: {f'ON (k={result.config.statistical_mean_k}, \u03c3={result.config.statistical_stddev})' if result.config.statistical_filter else 'OFF'}\",\n            f\"  Gaussian mesh:  {'ON (ISO 16610-61)' if result.config.gaussian_mesh else 'OFF'}\",\n            \"\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n            \"  Surface Patch & Sensor Validation\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n            f\"  Patch Dimensions (\u00a73.1.5): {patch_w:.1f} \u00d7 {patch_h:.1f} mm (Area: {result.patch_area_mm2:.0f} mm\u00b2)\",\n            f\"  Patch Size Status:         {'VALID (>= 50x50 mm)' if patch_valid else 'WARNING (\u003c 50x50 mm recommended)'}\",\n            f\"  Raw Points:                {result.points:,}\",\n            f\"  Processed Points:          {result.cropped_points:,}\",\n            f\"  Avg Point Spacing (\u00a78.2):  {spacing:.3f} mm (~{density:.1f} pts/mm\u00b2)\",\n            f\"  Point Density Status:      {'VALID (\u003c= 0.20 mm spacing)' if density_valid else 'WARNING (> 0.20 mm required)'}\",\n            \"  Scanner Accuracy (\u00a77.1):   Recommended \u003c 0.076 mm (0.0030 in)\",\n            f\"  Grid:                      {result.grid.raw.shape[1]} \u00d7 {result.grid.raw.shape[0]} cells, pitch={result.config.grid_mm:.4f} mm\",\n            f\"  Grid Coverage:             {result.grid.valid_filled.mean() * 100:.1f}%\",\n            \"\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n            \"  Visual Comparator Equivalents (Appendices X1-X3)\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n        ]\n    )\n\n    for std_name, grade in result.comparator_equivalents().items():\n        lines.append(f\"  {std_name:\u003c24}: {grade}\")\n\n    lines.extend(\n        [\n            \"\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n            \"  Plane & Geometry Alignment\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n            f\"  Plane centroid: {result.plane.centroid}\",\n            f\"  Plane normal:   {result.plane.normal}\",\n            (\n                f\"  Raw residual mm: \"\n                f\"std={result.raw_residual_std_mm:.6f} \"\n                f\"p05={result.raw_residual_p05_mm:.6f} \"\n                f\"p95={result.raw_residual_p95_mm:.6f}\"\n            ),\n            \"\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n            \"  Variogram Bins (Evaluation Length 0 to 5.0 mm)\",\n            \"\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\",\n        ]\n    )\n    for idx, value in enumerate(result.variogram_bins_um):\n        lo = idx * result.config.svr_span_mm\n        hi = (idx + 1) * result.config.svr_span_mm\n        if np.isfinite(value):\n            lines.append(\n                f\"  {lo:.3f}\u2013{hi:.3f} mm: {value:.3f} \u00b5m ({value / 1000.0:.4f} mm)  pairs={result.variogram_counts[idx]}\"\n            )\n        else:\n            lines.append(f\"  {lo:.3f}\u2013{hi:.3f} mm: no pairs\")\n    return \"\\n\".join(lines)\n", "svr_roughness/roughness.py": "\"\"\"Backward-compatible native-backed roughness module layout.\"\"\"\n\nfrom .analyze import analyze_file, analyze_ply, analyze_points, compute_roughness, compute_roughness_from_ply\nfrom .config import RoughnessConfig, config_from_values, parse_range\nfrom .io import load_ascii_ply, load_delimited, load_obj, load_pcd, load_ply, load_points, load_stl_vertices\nfrom .result import (\n    PlaneFit,\n    RoughnessGrid,\n    RoughnessResult,\n    format_report,\n    save_grid_npz,\n    save_metrics_json,\n)\n\n__all__ = [\n    \"PlaneFit\",\n    \"RoughnessConfig\",\n    \"RoughnessGrid\",\n    \"RoughnessResult\",\n    \"analyze_file\",\n    \"analyze_ply\",\n    \"analyze_points\",\n    \"compute_roughness\",\n    \"compute_roughness_from_ply\",\n    \"config_from_values\",\n    \"format_report\",\n    \"load_ascii_ply\",\n    \"load_delimited\",\n    \"load_obj\",\n    \"load_pcd\",\n    \"load_ply\",\n    \"load_points\",\n    \"load_stl_vertices\",\n    \"parse_range\",\n    \"save_grid_npz\",\n    \"save_metrics_json\",\n]\n", "app.py": "import concurrent.futures\nimport gzip\nimport io\nimport math\nimport sys\nimport tempfile\nimport time\nimport zipfile\nfrom pathlib import Path\nfrom typing import Any\n\nimport numpy as np\nimport pandas as pd\nimport plotly.graph_objects as go\nimport streamlit as st\n\nfrom svr_roughness import (\n    RoughnessConfig,\n    RoughnessResult,\n    analyze_file,\n    format_report,\n    svr_map,\n)\n\n# \u2500\u2500 Upload Transfer Timing Tracker \u2500\u2500\n_UPLOAD_TIMES: dict[str, float] = {}\n\n\ndef _install_upload_timing_hooks() -> None:\n    \"\"\"Safely hook Starlette ASGI upload routes to measure actual network transfer time.\"\"\"\n    if sys.platform == \"emscripten\":\n        return\n    try:\n        import gc\n        import starlette.routing\n\n        for obj in gc.get_objects():\n            if isinstance(obj, starlette.routing.Route):\n                path = getattr(obj, \"path\", \"\")\n                methods = getattr(obj, \"methods\", None)\n                if \"upload_file\" in path and methods and \"PUT\" in methods:\n                    if not getattr(obj, \"_upload_timing_hooked\", False):\n                        orig_app = obj.app\n\n                        def make_wrapper(inner):\n                            async def timed_app(scope, receive, send):\n                                if scope.get(\"type\") == \"http\" and scope.get(\"method\") == \"PUT\":\n                                    t0 = time.perf_counter()\n                                    try:\n                                        await inner(scope, receive, send)\n                                    finally:\n                                        dt = time.perf_counter() - t0\n                                        file_id = scope.get(\"path_params\", {}).get(\"file_id\")\n                                        if file_id:\n                                            _UPLOAD_TIMES[str(file_id)] = dt\n                                else:\n                                    await inner(scope, receive, send)\n\n                            return timed_app\n\n                        obj.app = make_wrapper(orig_app)\n                        setattr(obj, \"_upload_timing_hooked\", True)\n    except Exception:\n        pass\n\n    try:\n        from streamlit.runtime.memory_uploaded_file_manager import MemoryUploadedFileManager\n\n        if not getattr(MemoryUploadedFileManager, \"_timing_hooked\", False):\n            orig_add_file = MemoryUploadedFileManager.add_file\n\n            def timed_add_file(self, session_id, file):\n                if file.file_id not in _UPLOAD_TIMES:\n                    _UPLOAD_TIMES[f\"ts_{file.file_id}\"] = time.perf_counter()\n                return orig_add_file(self, session_id, file)\n\n            MemoryUploadedFileManager.add_file = timed_add_file\n            setattr(MemoryUploadedFileManager, \"_timing_hooked\", True)\n    except Exception:\n        pass\n\n\n_install_upload_timing_hooks()\n\nSUPPORTED_TYPES = [\"ply\", \"pcd\", \"stl\", \"obj\", \"csv\", \"tsv\", \"xyz\", \"txt\", \"npy\", \"npz\", \"gz\", \"zip\"]\nSCAN_EXTENSIONS = {\".ply\", \".pcd\", \".stl\", \".obj\", \".csv\", \".tsv\", \".xyz\", \".txt\", \".npy\", \".npz\"}\nCOLOR_SCALES = [\"Jet\", \"Turbo\", \"Viridis\", \"Plasma\", \"Inferno\", \"Rainbow\"]\nUNITS = [\"\u00b5m\", \"mm\", \"in\"]\n\nCUSTOM_CSS = \"\"\"\n    \u003cstyle>\n    /* Clean, modern typography and layout */\n    .main-header {\n        font-size: 1.65rem;\n        font-weight: 700;\n        letter-spacing: -0.02em;\n        margin-bottom: 0.15rem;\n    }\n    .sub-header {\n        font-size: 0.88rem;\n        opacity: 0.75;\n        margin-bottom: 1.25rem;\n    }\n    /* Status Ribbon */\n    .status-ribbon {\n        display: flex;\n        flex-wrap: wrap;\n        gap: 0.85rem;\n        align-items: center;\n        background: rgba(127, 127, 127, 0.08);\n        border: 1px solid rgba(127, 127, 127, 0.22);\n        border-radius: 8px;\n        padding: 0.7rem 1.1rem;\n        margin-bottom: 1.25rem;\n        font-size: 0.86rem;\n    }\n    .ribbon-item {\n        display: flex;\n        align-items: center;\n        gap: 0.45rem;\n    }\n    .ribbon-label {\n        opacity: 0.7;\n        font-weight: 500;\n    }\n    .ribbon-value {\n        font-weight: 600;\n    }\n    .badge {\n        display: inline-block;\n        padding: 0.22rem 0.6rem;\n        border-radius: 4px;\n        font-size: 0.75rem;\n        font-weight: 700;\n        text-transform: uppercase;\n        letter-spacing: 0.04em;\n    }\n    .badge-pass {\n        background-color: rgba(34, 197, 94, 0.18);\n        color: #22c55e;\n        border: 1px solid rgba(34, 197, 94, 0.4);\n    }\n    .badge-fail {\n        background-color: rgba(239, 68, 68, 0.18);\n        color: #ef4444;\n        border: 1px solid rgba(239, 68, 68, 0.4);\n    }\n    .badge-neutral {\n        background-color: rgba(148, 163, 184, 0.18);\n        color: #94a3b8;\n        border: 1px solid rgba(148, 163, 184, 0.35);\n    }\n    .badge-warn {\n        background-color: rgba(245, 158, 11, 0.18);\n        color: #f59e0b;\n        border: 1px solid rgba(245, 158, 11, 0.4);\n    }\n    /* Primary KPI Card */\n    .kpi-card {\n        background: rgba(127, 127, 127, 0.07);\n        border: 1px solid rgba(127, 127, 127, 0.22);\n        border-radius: 8px;\n        padding: 1.15rem;\n        margin-bottom: 0.9rem;\n    }\n    .kpi-title {\n        font-size: 0.8rem;\n        font-weight: 600;\n        opacity: 0.7;\n        text-transform: uppercase;\n        letter-spacing: 0.06em;\n        margin-bottom: 0.25rem;\n    }\n    .kpi-value-primary {\n        font-size: 2.1rem;\n        font-weight: 700;\n        line-height: 1.15;\n    }\n    .kpi-value-sub {\n        font-size: 0.82rem;\n        opacity: 0.65;\n        margin-top: 0.35rem;\n        font-family: monospace;\n    }\n    /* Secondary Metric Grid */\n    .sec-metric {\n        border-top: 1px solid rgba(127, 127, 127, 0.15);\n        padding-top: 0.55rem;\n        margin-top: 0.55rem;\n        display: flex;\n        justify-content: space-between;\n        align-items: baseline;\n    }\n    .sec-label {\n        font-size: 0.83rem;\n        opacity: 0.72;\n    }\n    .sec-val {\n        font-size: 0.94rem;\n        font-weight: 600;\n    }\n    \u003c/style>\n\"\"\"\n\n\ndef extract_scan_payload(\n    raw_bytes: bytes,\n    file_name: str,\n) -> tuple[bytes, str, dict[str, Any]]:\n    \"\"\"Detect compression containers (gzip/zip) and decompress transparently in RAM.\n\n    Returns:\n        (decompressed_bytes, effective_file_name, metadata)\n    \"\"\"\n    t0 = time.perf_counter()\n    lower_name = file_name.lower()\n\n    # GZIP magic bytes: 0x1f 0x8b\n    if raw_bytes.startswith(b\"\\x1f\\x8b\"):\n        decompressed = gzip.decompress(raw_bytes)\n        dt_ms = (time.perf_counter() - t0) * 1000.0\n        effective_name = file_name[:-3] if lower_name.endswith(\".gz\") else file_name\n        orig_sz = len(decompressed)\n        comp_sz = len(raw_bytes)\n        meta = {\n            \"container\": \"gzip\",\n            \"compressed_bytes\": comp_sz,\n            \"uncompressed_bytes\": orig_sz,\n            \"decompress_time_ms\": dt_ms,\n            \"ratio_pct\": ((orig_sz - comp_sz) / max(orig_sz, 1)) * 100.0,\n        }\n        return decompressed, effective_name, meta\n\n    # ZIP magic bytes: PK\\x03\\x04\n    if raw_bytes.startswith(b\"PK\\x03\\x04\"):\n        with zipfile.ZipFile(io.BytesIO(raw_bytes)) as zf:\n            candidates = [\n                name for name in zf.namelist()\n                if not name.startswith(\"__MACOSX\")\n                and not Path(name).name.startswith(\".\")\n                and Path(name).suffix.lower() in SCAN_EXTENSIONS\n            ]\n            if not candidates:\n                raise ValueError(\"Zip archive contains no supported 3D scan files (.ply, .pcd, .stl, etc.)\")\n            target_name = candidates[0]\n            decompressed = zf.read(target_name)\n            dt_ms = (time.perf_counter() - t0) * 1000.0\n            orig_sz = len(decompressed)\n            comp_sz = len(raw_bytes)\n            meta = {\n                \"container\": \"zip\",\n                \"compressed_bytes\": comp_sz,\n                \"uncompressed_bytes\": orig_sz,\n                \"decompress_time_ms\": dt_ms,\n                \"ratio_pct\": ((orig_sz - comp_sz) / max(orig_sz, 1)) * 100.0,\n            }\n            return decompressed, Path(target_name).name, meta\n\n    # Raw uncompressed\n    meta = {\n        \"container\": \"none\",\n        \"compressed_bytes\": len(raw_bytes),\n        \"uncompressed_bytes\": len(raw_bytes),\n        \"decompress_time_ms\": 0.0,\n        \"ratio_pct\": 0.0,\n    }\n    return raw_bytes, file_name, meta\n\n\ndef generate_inspection_report(result: RoughnessResult, unit: str) -> str:\n    \"\"\"Format ASTM WK92969 inspection report with minimum compliant S_VR or N/A.\"\"\"\n    base_report = format_report(result)\n    patch_ok = (result.patch_width_mm >= 50.0 and result.patch_height_mm >= 50.0)\n    density_ok = (result.average_point_spacing_mm \u003c= 0.20)\n    is_valid = patch_ok and density_ok\n\n    if not is_valid:\n        compliance_text = (\n            \"  Specification Compliance (\u00a75.3): N/A\\n\"\n            \"  Compliance Status:              INVALID (Specimen fails ASTM WK92969 patch size or point pitch criteria)\\n\"\n        )\n    else:\n        svr_str = format_unit_val(result.svr_um, unit)\n        compliance_text = (\n            f\"  Specification Compliance (\u00a75.3): S_VR \u003c= {svr_str} ({result.svr_mm:.4f} mm / {result.svr_in:.5f} in)\\n\"\n            f\"  Compliance Status:              COMPLIANT (Minimum allowable S_VR specification threshold satisfied)\\n\"\n        )\n\n    next_marker = \"\u00a710.1.2  Evaluation Length\"\n    if next_marker in base_report:\n        parts = base_report.split(next_marker, 1)\n        return parts[0] + compliance_text + \"\\n\" + next_marker + parts[1]\n\n    return base_report + \"\\n\" + compliance_text\n\n\nUPLOAD_BRIDGE_HTML = \"\"\"\n\u003cdiv id=\"upload-status-banner\" style=\"display: none; margin-bottom: 1.25rem; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 8px; padding: 0.85rem 1.15rem; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;\">\n  \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.86rem;\">\n    \u003cdiv style=\"display: flex; align-items: center; gap: 0.5rem;\">\n      \u003cspan style=\"display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38bdf8;\">\u003c/span>\n      \u003cspan id=\"upload-status-text\" style=\"font-weight: 600; color: #38bdf8;\">Uploading 3D scan...\u003c/span>\n    \u003c/div>\n    \u003cspan id=\"upload-status-pct\" style=\"font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums;\">0%\u003c/span>\n  \u003c/div>\n  \u003cdiv style=\"width: 100%; height: 6px; background: rgba(127, 127, 127, 0.18); border-radius: 3px; overflow: hidden;\">\n    \u003cdiv id=\"upload-status-fill\" style=\"width: 0%; height: 100%; background: #38bdf8; border-radius: 3px; transition: width 0.08s ease-out;\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function() {\n  const win = window.parent || window;\n  const doc = win.document || document;\n\n  function updateBanner(text, pct) {\n    const banner = doc.getElementById('upload-status-banner');\n    const fill = doc.getElementById('upload-status-fill');\n    const txt = doc.getElementById('upload-status-text');\n    const pctEl = doc.getElementById('upload-status-pct');\n    if (banner) banner.style.display = 'block';\n    if (fill) fill.style.width = Math.min(100, Math.max(0, pct)) + '%';\n    if (pctEl) pctEl.textContent = Math.round(pct) + '%';\n    if (txt && text) txt.textContent = text;\n  }\n\n  // 1. Universal XHR hook for live upload progress display\n  if (!win._surfInspectXhrHooked) {\n    win._surfInspectXhrHooked = true;\n    const origOpen = win.XMLHttpRequest.prototype.open;\n    const origSend = win.XMLHttpRequest.prototype.send;\n\n    win.XMLHttpRequest.prototype.open = function(method, url) {\n      this._url = url;\n      this._method = method;\n      return origOpen.apply(this, arguments);\n    };\n\n    win.XMLHttpRequest.prototype.send = function(data) {\n      if (this._method === 'PUT' && this._url && this._url.includes('_stcore/upload_file')) {\n        updateBanner('Uploading surface scan to inspection engine...', 5);\n        if (this.upload) {\n          this.upload.addEventListener('progress', function(e) {\n            if (e.lengthComputable) {\n              const pct = (e.loaded / e.total) * 100;\n              const loadedMb = (e.loaded / 1048576).toFixed(1);\n              const totalMb = (e.total / 1048576).toFixed(1);\n              if (pct \u003c 99.5) {\n                updateBanner(`Uploading 3D scan (${loadedMb} / ${totalMb} MB)...`, pct);\n              } else {\n                updateBanner('Upload complete. Handing over to Svr metrology engine...', 100);\n              }\n            }\n          });\n          this.upload.addEventListener('load', function() {\n            updateBanner('Upload complete. Handing over to Svr metrology engine...', 100);\n          });\n        }\n      }\n      return origSend.apply(this, arguments);\n    };\n  }\n\n  // 2. Client-side transparent gzip compression hook\n  function hookStreamlitEndpoints() {\n    if (win._surfInspectEndpointsHooked) return true;\n    try {\n      const root = doc.getElementById('root');\n      if (!root) return false;\n      const fiberKey = Object.keys(root).find(k => k.startsWith('__reactContainer') || k.startsWith('__reactFiber'));\n      if (!fiberKey) return false;\n\n      let queue = [root[fiberKey]];\n      let endpoints = null;\n\n      while (queue.length > 0 && queue.length \u003c 500) {\n        let node = queue.shift();\n        if (!node) continue;\n        if (node.stateNode && node.stateNode.endpoints) {\n          endpoints = node.stateNode.endpoints;\n          break;\n        }\n        if (node.memoizedProps && node.memoizedProps.endpoints) {\n          endpoints = node.memoizedProps.endpoints;\n          break;\n        }\n        if (node.child) queue.push(node.child);\n        if (node.sibling) queue.push(node.sibling);\n      }\n\n      if (endpoints && endpoints.uploadFileUploaderFile) {\n        const origUpload = endpoints.uploadFileUploaderFile.bind(endpoints);\n        endpoints.uploadFileUploaderFile = async function(uploadUrl, file, sessionId, onUploadProgress, abortSignal) {\n          let fileToUpload = file;\n          if (typeof CompressionStream !== 'undefined' && file.size > 300000 && !file.name.endsWith('.gz') && !file.name.endsWith('.zip')) {\n            try {\n              updateBanner(`Compressing ${file.name} for high-speed transmission...`, 15);\n              const stream = file.stream().pipeThrough(new CompressionStream('gzip'));\n              const blob = await new Response(stream).blob();\n              fileToUpload = new File([blob], file.name + '.gz', { type: 'application/gzip' });\n              updateBanner(`Compressed to ${(fileToUpload.size / 1048576).toFixed(1)} MB. Uploading...`, 25);\n            } catch (err) {\n              fileToUpload = file;\n            }\n          }\n          return origUpload(uploadUrl, fileToUpload, sessionId, onUploadProgress, abortSignal);\n        };\n        win._surfInspectEndpointsHooked = true;\n        return true;\n      }\n    } catch (e) {}\n    return false;\n  }\n\n  if (!hookStreamlitEndpoints()) {\n    const timer = setInterval(function() {\n      if (hookStreamlitEndpoints()) clearInterval(timer);\n    }, 200);\n    setTimeout(function() { clearInterval(timer); }, 10000);\n  }\n})();\n\u003c/script>\n\"\"\"\n\n\ndef main() -> None:\n    st.set_page_config(\n        page_title=\"S_VR Metrology | ASTM WK92969\",\n        layout=\"wide\",\n        initial_sidebar_state=\"expanded\",\n    )\n    st.markdown(CUSTOM_CSS, unsafe_allow_html=True)\n    st.markdown('\u003cdiv class=\"main-header\">S\u003csub>VR\u003c/sub> Surface Roughness Metrology\u003c/div>', unsafe_allow_html=True)\n    st.markdown(\n        '\u003cdiv class=\"sub-header\">ASTM WK92969 Digital Surface Inspection Standard &bull; ISO 16610-61 Gaussian Areal Filtration\u003c/div>',\n        unsafe_allow_html=True,\n    )\n    if sys.platform != \"emscripten\":\n        st.html(UPLOAD_BRIDGE_HTML, unsafe_allow_javascript=True)\n\n    with st.sidebar:\n        st.subheader(\"Inspection Setup\")\n        uploaded_file = st.file_uploader(\"Surface Scan File\", type=SUPPORTED_TYPES)\n\n        selected_unit = st.selectbox(\n            \"Measurement Units\",\n            UNITS,\n            index=0,\n            help=\"Select display unit for roughness values and colorbar scales.\",\n        )\n\n        with st.expander(\"Filter & Sampling Standards\", expanded=False):\n            grid_mm = st.number_input(\n                \"Grid Pitch / Downsample (mm)\",\n                min_value=0.001,\n                value=0.20,\n                step=0.05,\n                help=\"Spatial resolution. ASTM WK92969 \u00a78.2 standard is 0.20 mm.\",\n            )\n            short_cutoff_mm = st.number_input(\n                \"Short Cutoff \u03bbs (mm)\",\n                min_value=0.0,\n                value=1.0,\n                step=0.1,\n                help=\"High-frequency cutoff. ASTM WK92969 \u00a79.1 recommended is 1.0 mm.\",\n            )\n            long_cutoff_mm = st.number_input(\n                \"Long Cutoff \u03bbc (mm)\",\n                min_value=0.0,\n                value=25.0,\n                step=1.0,\n                help=\"Low-frequency cutoff. ASTM WK92969 \u00a79.1 recommended is 25.0 mm.\",\n            )\n            gaussian_mesh = st.checkbox(\n                \"ISO 16610-61 Gaussian Form Removal\",\n                value=True,\n                help=\"Enforces dual-pass areal Gaussian filtering with alpha=0.4697.\",\n            )\n\n        st.subheader(\"Visualization\")\n        color_scale = st.selectbox(\"Color Palette\", COLOR_SCALES, index=0)\n        robust_contrast = st.checkbox(\n            \"Robust Contrast (1st\u201399th Percentile)\",\n            value=True,\n            help=\"Suppresses outlier boundary spikes to preserve micro-roughness dynamic range.\",\n        )\n\n    if uploaded_file is None:\n        for k in [\n            \"current_scan_result\",\n            \"current_svr_grid_um\",\n            \"scan_upload_id\",\n            \"filter_signature\",\n            \"last_analysis_time\",\n            \"decomp_time_ms\",\n            \"upload_time_s\",\n            \"effective_name\",\n        ]:\n            st.session_state.pop(k, None)\n        st.info(\"Upload a 3D scan (.pcd, .ply, .stl, .csv) in the sidebar to begin inspection.\")\n        return\n\n    # Unique upload identifier per file upload event in Streamlit\n    upload_id = getattr(uploaded_file, \"file_id\", getattr(uploaded_file, \"id\", None))\n    if upload_id is None:\n        upload_id = f\"{uploaded_file.name}_{uploaded_file.size}\"\n\n    filter_sig = (grid_mm, short_cutoff_mm, long_cutoff_mm, gaussian_mesh)\n\n    # Re-run inspection only if a new file upload is presented or physical filter settings change.\n    # Display parameter changes (color palette, units, contrast ceiling, interpolation) update instantly.\n    need_analysis = (\n        \"current_scan_result\" not in st.session_state\n        or st.session_state.get(\"scan_upload_id\") != upload_id\n        or st.session_state.get(\"filter_signature\") != filter_sig\n    )\n\n    if need_analysis:\n        raw_bytes = uploaded_file.getvalue()\n        file_bytes, effective_name, meta = extract_scan_payload(raw_bytes, uploaded_file.name)\n        decomp_time_ms = meta.get(\"decompress_time_ms\", 0.0)\n        decompress_time_s = decomp_time_ms / 1000.0\n\n        # Retrieve tracked upload transfer time for this file\n        upload_time_s = _UPLOAD_TIMES.get(str(upload_id))\n\n        # Calibrated analysis duration estimate based on payload size and filter mode\n        payload_mb = len(file_bytes) / (1024 * 1024)\n        if gaussian_mesh:\n            est_duration = max(0.20, 0.06 + payload_mb * 0.038)\n        else:\n            est_duration = max(1.50, 0.50 + payload_mb * 1.15)\n\n        progress_bar = st.progress(0.0, text=\"Initializing surface topography analysis...\")\n        t_prog_start = time.perf_counter()\n\n        try:\n            if sys.platform == \"emscripten\":\n                progress_bar.progress(0.35, text=\"Analyzing surface topography (\u00a78.2 Areal Grid)...\")\n                result, timings = run_analysis(\n                    file_bytes,\n                    effective_name,\n                    grid_mm,\n                    short_cutoff_mm,\n                    long_cutoff_mm,\n                    gaussian_mesh,\n                    decompress_time_s=decompress_time_s,\n                )\n            else:\n                with concurrent.futures.ThreadPoolExecutor(max_workers=1) as executor:\n                    future = executor.submit(\n                        run_analysis,\n                        file_bytes,\n                        effective_name,\n                        grid_mm,\n                        short_cutoff_mm,\n                        long_cutoff_mm,\n                        gaussian_mesh,\n                        decompress_time_s=decompress_time_s,\n                    )\n\n                    while not future.done():\n                        elapsed = time.perf_counter() - t_prog_start\n                        ratio = elapsed / est_duration\n                        if ratio \u003c 0.90:\n                            prog = ratio * 0.90\n                        else:\n                            # Smooth asymptotic approach towards 0.97 without stalling\n                            prog = 0.81 + (1.0 - math.exp(-(ratio - 0.90) * 1.5)) * 0.16\n                        prog = min(max(prog, 0.0), 0.97)\n\n                        rem = max(0.0, est_duration - elapsed)\n                        if rem > 0.05:\n                            status_text = f\"Analyzing surface topography (\u00a78.2 Areal Grid)... (~{rem:.1f}s remaining)\"\n                        else:\n                            status_text = \"Finalizing Svr calculation & spatial grid...\"\n\n                        progress_bar.progress(prog, text=status_text)\n                        time.sleep(0.025)\n\n                    result, timings = future.result()\n\n            progress_bar.progress(1.0, text=\"Analysis complete!\")\n            time.sleep(0.04)\n\n            if result.grid.svr_map is not None:\n                svr_grid_um = result.grid.svr_map\n            elif result.grid.filtered is not None and result.grid.valid_filled is not None:\n                svr_grid_um = svr_map(\n                    result.grid.filtered,\n                    result.grid.valid_filled,\n                    result.config.grid_mm,\n                    result.config.svr_points,\n                    result.config.svr_span_mm,\n                )\n            else:\n                svr_grid_um = np.zeros((result.grid.height, result.grid.width))\n\n            analysis_time = timings.get(\"total\", 0.0)\n\n            # Store in session state for instant display manipulation\n            st.session_state[\"current_scan_result\"] = result\n            st.session_state[\"current_svr_grid_um\"] = svr_grid_um\n            st.session_state[\"scan_upload_id\"] = upload_id\n            st.session_state[\"filter_signature\"] = filter_sig\n            st.session_state[\"last_analysis_time\"] = analysis_time\n            st.session_state[\"decomp_time_ms\"] = decomp_time_ms\n            st.session_state[\"upload_time_s\"] = upload_time_s\n            st.session_state[\"stage_timings\"] = timings\n            st.session_state[\"effective_name\"] = effective_name\n        except Exception as exc:\n            st.error(f\"Analysis failed: {exc}\")\n            return\n        finally:\n            progress_bar.empty()\n    else:\n        result = st.session_state[\"current_scan_result\"]\n        svr_grid_um = st.session_state[\"current_svr_grid_um\"]\n        analysis_time = st.session_state.get(\"last_analysis_time\", 0.0)\n        decomp_time_ms = st.session_state.get(\"decomp_time_ms\", 0.0)\n        upload_time_s = st.session_state.get(\"upload_time_s\")\n        timings = st.session_state.get(\"stage_timings\")\n        effective_name = st.session_state.get(\"effective_name\", uploaded_file.name)\n\n    render_dashboard(\n        result,\n        svr_grid_um,\n        effective_name,\n        color_scale,\n        robust_contrast,\n        selected_unit,\n        analysis_time,\n        decomp_time_ms=decomp_time_ms,\n        upload_time_s=upload_time_s,\n    )\n\n\ndef run_analysis(\n    file_bytes: bytes,\n    file_name: str,\n    grid_mm: float,\n    short_cutoff_mm: float,\n    long_cutoff_mm: float,\n    gaussian_mesh: bool,\n    decompress_time_s: float = 0.0,\n) -> tuple[RoughnessResult, dict[str, float]]:\n    t_start = time.perf_counter()\n    suffix = Path(file_name).suffix.lower()\n    with tempfile.NamedTemporaryFile(delete=False, suffix=suffix) as tmp:\n        tmp.write(file_bytes)\n        tmp_path = Path(tmp.name)\n\n    try:\n        t_write = time.perf_counter()\n        config = RoughnessConfig(\n            grid_mm=grid_mm,\n            short_cutoff_mm=short_cutoff_mm,\n            long_cutoff_mm=long_cutoff_mm,\n            gaussian_mesh=gaussian_mesh,\n        )\n        from svr_roughness.io import load_points\n        from svr_roughness.analyze import analyze_points\n        points = load_points(tmp_path)\n        t_load = time.perf_counter()\n\n        result = analyze_points(points, config=config)\n        t_analyze = time.perf_counter()\n\n        timings = {\n            \"decomp\": decompress_time_s,\n            \"write\": t_write - t_start,\n            \"load\": t_load - t_write,\n            \"core\": t_analyze - t_load,\n            \"total\": t_analyze - t_start,\n        }\n        return result, timings\n    finally:\n        tmp_path.unlink(missing_ok=True)\n\n\ndef format_unit_val(val_um: float, unit: str) -> str:\n    if unit == \"\u00b5m\":\n        return f\"{val_um:.3f} \u00b5m\"\n    if unit == \"mm\":\n        return f\"{val_um / 1000.0:.4f} mm\"\n    if unit == \"in\":\n        return f\"{val_um / 25400.0:.5f} in\"\n    return f\"{val_um:.3f}\"\n\n\ndef render_dashboard(\n    result: RoughnessResult,\n    svr_grid_um: np.ndarray,\n    file_name: str,\n    color_scale: str,\n    robust_contrast: bool,\n    unit: str,\n    analysis_time: float,\n    decomp_time_ms: float = 0.0,\n    upload_time_s: float | None = None,\n) -> None:\n    # \u2500\u2500 Unit Conversion for 2D Grid \u2500\u2500\n    if unit == \"mm\":\n        grid_display = svr_grid_um / 1000.0\n    elif unit == \"in\":\n        grid_display = svr_grid_um / 25400.0\n    else:\n        grid_display = svr_grid_um\n\n    # \u2500\u2500 Physical Checks per ASTM WK92969 \u2500\u2500\n    patch_w = result.patch_width_mm\n    patch_h = result.patch_height_mm\n    spacing = result.average_point_spacing_mm\n\n    patch_ok = (patch_w >= 50.0 and patch_h >= 50.0)\n    density_ok = (spacing \u003c= 0.20)\n\n    # \u2500\u2500 Status Ribbon \u2500\u2500\n    svr_display = format_unit_val(result.svr_um, unit)\n\n    patch_badge = (\n        f'\u003cspan class=\"badge badge-pass\">{patch_w:.1f} &times; {patch_h:.1f} mm\u003c/span>'\n        if patch_ok\n        else f'\u003cspan class=\"badge badge-warn\">{patch_w:.1f} &times; {patch_h:.1f} mm (&lt; 50 mm)\u003c/span>'\n    )\n    density_badge = (\n        f'\u003cspan class=\"badge badge-pass\">{spacing:.3f} mm\u003c/span>'\n        if density_ok\n        else f'\u003cspan class=\"badge badge-warn\">{spacing:.3f} mm (&gt; 0.20 mm)\u003c/span>'\n    )\n\n    # Timings\n    decomp_display = (\n        f\"{decomp_time_ms:.0f} ms\"\n        if (0.0 \u003c decomp_time_ms \u003c 1000.0)\n        else (f\"{decomp_time_ms / 1000.0:.2f}s\" if decomp_time_ms >= 1000.0 else \"N/A\")\n    )\n    upload_display = (\n        f\"{upload_time_s * 1000.0:.0f} ms\"\n        if (upload_time_s is not None and 0.0 \u003c upload_time_s \u003c 1.0)\n        else (f\"{upload_time_s:.2f}s\" if upload_time_s is not None and upload_time_s >= 1.0 else \"N/A\")\n    )\n    analysis_display = (\n        f\"{analysis_time * 1000.0:.0f} ms\"\n        if analysis_time \u003c 1.0\n        else f\"{analysis_time:.2f}s\"\n    )\n\n    ribbon_html = f\"\"\"\n    \u003cdiv class=\"status-ribbon\">\n        \u003cdiv class=\"ribbon-item\">\n            \u003cspan class=\"ribbon-label\">File:\u003c/span>\n            \u003cspan class=\"ribbon-value\">{file_name}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ribbon-item\">\n            \u003cspan class=\"ribbon-label\">S\u003csub>VR\u003c/sub>:\u003c/span>\n            \u003cspan class=\"ribbon-value\" style=\"color:#38bdf8;\">{svr_display}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ribbon-item\">\n            \u003cspan class=\"ribbon-label\">Patch Size (\u00a73.1.5):\u003c/span>\n            {patch_badge}\n        \u003c/div>\n        \u003cdiv class=\"ribbon-item\">\n            \u003cspan class=\"ribbon-label\">Point Pitch (\u00a78.2):\u003c/span>\n            {density_badge}\n        \u003c/div>\n        \u003cdiv class=\"ribbon-item\" style=\"margin-left: auto;\">\n            \u003cspan class=\"ribbon-label\">Decomp:\u003c/span>\n            \u003cspan class=\"ribbon-value\">{decomp_display}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ribbon-item\">\n            \u003cspan class=\"ribbon-label\">Upload:\u003c/span>\n            \u003cspan class=\"ribbon-value\">{upload_display}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"ribbon-item\">\n            \u003cspan class=\"ribbon-label\">Analysis:\u003c/span>\n            \u003cspan class=\"ribbon-value\" style=\"color:#38bdf8;\">{analysis_display}\u003c/span>\n        \u003c/div>\n    \u003c/div>\n    \"\"\"\n    st.markdown(ribbon_html, unsafe_allow_html=True)\n    st.html(\n        \"\"\"\u003cscript>\n        (function() {\n          const win = window.parent || window;\n          const doc = win.document || document;\n          const banner = doc.getElementById('upload-status-banner');\n          if (banner) banner.style.display = 'none';\n        })();\n        \u003c/script>\"\"\",\n        unsafe_allow_javascript=True,\n    )\n\n    # \u2500\u2500 Main View: Interactive Heatmap + Primary KPI Card \u2500\u2500\n    col_chart, col_kpi = st.columns([3, 1])\n\n    with col_chart:\n        st.plotly_chart(\n            build_figure(result, grid_display, color_scale, robust_contrast, unit),\n            width=\"stretch\",\n            config={\"displaylogo\": False},\n        )\n\n    with col_kpi:\n        # Highlight Primary Metric: S_VR\n        svr_primary = format_unit_val(result.svr_um, unit)\n        svr_alt = f\"{result.svr_mm:.4f} mm &bull; {result.svr_um:.2f} &mu;m &bull; {result.svr_in:.5f} in\"\n        eval_len = result.config.svr_points * result.config.svr_span_mm\n\n        kpi_card_html = f\"\"\"\n        \u003cdiv class=\"kpi-card\">\n            \u003cdiv class=\"kpi-title\">Surface Variogram Roughness (S\u003csub>VR\u003c/sub>)\u003c/div>\n            \u003cdiv class=\"kpi-value-primary\">{svr_primary}\u003c/div>\n            \u003cdiv class=\"kpi-value-sub\">{svr_alt}\u003c/div>\n            \u003cdiv class=\"sec-metric\">\n                \u003cspan class=\"sec-label\">Arithmetic Mean (Sa)\u003c/span>\n                \u003cspan class=\"sec-val\">{format_unit_val(result.sa_um, unit)}\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"sec-metric\">\n                \u003cspan class=\"sec-label\">Root Mean Square (Sq)\u003c/span>\n                \u003cspan class=\"sec-val\">{format_unit_val(result.sq_um, unit)}\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"sec-metric\">\n                \u003cspan class=\"sec-label\">Active Surface Points\u003c/span>\n                \u003cspan class=\"sec-val\">{result.cropped_points:,}\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"sec-metric\">\n                \u003cspan class=\"sec-label\">Grid Coverage\u003c/span>\n                \u003cspan class=\"sec-val\">{result.grid.valid_filled.mean() * 100:.1f}%\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"sec-metric\">\n                \u003cspan class=\"sec-label\">Evaluation Length\u003c/span>\n                \u003cspan class=\"sec-val\">{eval_len:.1f} mm\u003c/span>\n            \u003c/div>\n        \u003c/div>\n        \"\"\"\n        st.markdown(kpi_card_html, unsafe_allow_html=True)\n\n    # \u2500\u2500 Structured Inspection Tabs \u2500\u2500\n    tab_comp, tab_var, tab_rep = st.tabs([\"Comparator Equivalents\", \"Variogram Distribution\", \"Inspection Report\"])\n\n    with tab_comp:\n        comps = result.comparator_equivalents()\n        data = [\n            {\"Standard / Reference\": \"SCRATA (ASTM A802, Appendix X2)\", \"Visual Rating\": comps[\"SCRATA (ASTM A802)\"], \"Reference Type\": \"Cast steel comparator plates (A1\u2013A4)\"},\n            {\"Standard / Reference\": \"GAR C-9 (Appendix X1)\", \"Visual Rating\": comps[\"GAR C-9\"], \"Reference Type\": \"Microfinish comparator (200\u2013900)\"},\n            {\"Standard / Reference\": \"ACI Surface Indicator (Appendix X3)\", \"Visual Rating\": comps[\"ACI SIS\"], \"Reference Type\": \"Alloy Casting Institute scale (SIS-1\u2013SIS-4)\"},\n        ]\n        df_comp = pd.DataFrame(data)\n        st.dataframe(df_comp, hide_index=True, width=\"stretch\")\n\n    with tab_var:\n        distances = [\n            idx * result.config.svr_span_mm + (result.config.svr_span_mm / 2.0)\n            for idx in range(len(result.variogram_bins_um))\n        ]\n        bin_vals = [\n            (val / 1000.0 if unit == \"mm\" else (val / 25400.0 if unit == \"in\" else val))\n            for val in result.variogram_bins_um\n        ]\n\n        fig_var = go.Figure()\n        fig_var.add_trace(\n            go.Scatter(\n                x=distances,\n                y=bin_vals,\n                mode=\"lines+markers\",\n                marker={\"size\": 6, \"color\": \"#0284c7\"},\n                line={\"width\": 2, \"color\": \"#0284c7\"},\n                name=\"v(d)\",\n                hovertemplate=\"Distance: %{x:.2f} mm\u003cbr>v(d): %{y:.4f}\u003cextra>\u003c/extra>\",\n            )\n        )\n        fig_var.update_layout(\n            height=300,\n            margin={\"l\": 0, \"r\": 0, \"t\": 16, \"b\": 0},\n            xaxis_title=\"Distance Bucket Center d (mm)\",\n            yaxis_title=f\"Roughness v(d) ({unit})\",\n            xaxis={\"showgrid\": True, \"gridcolor\": \"rgba(127,127,127,0.18)\"},\n            yaxis={\"showgrid\": True, \"gridcolor\": \"rgba(127,127,127,0.18)\"},\n            plot_bgcolor=\"rgba(0,0,0,0)\",\n            paper_bgcolor=\"rgba(0,0,0,0)\",\n        )\n        st.plotly_chart(fig_var, width=\"stretch\", config={\"displaylogo\": False})\n\n    with tab_rep:\n        report_text = generate_inspection_report(result, unit)\n        st.code(report_text, language=\"text\")\n\n        st.download_button(\n            \"Download Report (.txt)\",\n            data=report_text,\n            file_name=f\"ASTM_WK92969_{Path(file_name).stem}.txt\",\n            mime=\"text/plain\",\n        )\n\n\ndef build_figure(\n    result: RoughnessResult,\n    grid: np.ndarray,\n    color_scale: str,\n    robust_contrast: bool,\n    unit: str,\n) -> go.Figure:\n    origin_x, origin_y, pitch = result.grid.origin\n    valid_vals = grid[~np.isnan(grid)] if np.any(~np.isnan(grid)) else np.array([0.0])\n\n    if robust_contrast and len(valid_vals) > 0:\n        zmin = float(np.percentile(valid_vals, 1.0))\n        zmax = float(np.percentile(valid_vals, 99.0))\n    else:\n        zmin = float(np.percentile(valid_vals, 0.5)) if len(valid_vals) > 0 else None\n        zmax = float(np.percentile(valid_vals, 99.8)) if len(valid_vals) > 0 else None\n\n    trace = go.Heatmap(\n        z=grid,\n        x=[origin_x + index * pitch for index in range(grid.shape[1])],\n        y=[origin_y + index * pitch for index in range(grid.shape[0])],\n        colorscale=color_scale,\n        zmin=zmin,\n        zmax=zmax,\n        zsmooth=False,\n        colorbar={\n            \"title\": f\"S\u003csub>VR\u003c/sub> ({unit})\",\n            \"len\": 0.95,\n            \"thickness\": 16,\n            \"tickfont\": {\"size\": 11, \"family\": \"Inter, sans-serif\"},\n        },\n        hovertemplate=f\"X: %{{x:.2f}} mm\u003cbr>Y: %{{y:.2f}} mm\u003cbr>Local S\u003csub>VR\u003c/sub>: %{{z:.4f}} {unit}\u003cextra>\u003c/extra>\",\n    )\n\n    figure = go.Figure(data=[trace])\n    figure.update_layout(\n        height=660,\n        margin={\"l\": 0, \"r\": 0, \"t\": 24, \"b\": 0},\n        xaxis_title=\"Surface X (mm)\",\n        yaxis_title=\"Surface Y (mm)\",\n        xaxis={\"showgrid\": False},\n        yaxis={\"showgrid\": False, \"scaleanchor\": \"x\", \"scaleratio\": 1},\n        plot_bgcolor=\"rgba(0,0,0,0)\",\n        paper_bgcolor=\"rgba(0,0,0,0)\",\n        font={\"family\": \"Inter, sans-serif\"},\n    )\n    return figure\n\n\nif __name__ == \"__main__\":\n    main()\n\n"}</script>

    <script>
      window.addEventListener('error', function(e) {
        var eb = document.getElementById('error-box');
        var ls = document.getElementById('loading-status');
        if (eb) {
          eb.style.display = 'block';
          eb.textContent = 'Startup error: ' + (e.message || e.error || e);
        }
        if (ls) {
          ls.style.color = '#ef4444';
          ls.textContent = 'Runtime initialization failed.';
        }
      });
    </script>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

      const files = JSON.parse(document.getElementById("stlite-files").textContent);

      mount(
        {
          entrypoint: "app.py",
          files: files,
          requirements: ["numpy", "scipy", "pandas", "plotly"],
          streamlitConfig: {
            "client.toolbarMode": "minimal",
            "theme.base": "dark",
            "theme.primaryColor": "#38bdf8",
            "theme.backgroundColor": "#0e1117",
            "theme.secondaryBackgroundColor": "#1a1f2c",
            "theme.textColor": "#f1f5f9"
          }
        },
        document.getElementById("root")
      );

      // Hide loading screen once Streamlit renders its first DOM element
      const observer = new MutationObserver(() => {
        const appElem = document.querySelector('#root .stApp') || document.querySelector('#root [data-testid="stAppViewContainer"]');
        if (appElem) {
          const loader = document.getElementById('loading-container');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 320);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
